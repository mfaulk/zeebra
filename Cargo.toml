# Standalone package: prevents Cargo from searching parent directories for a workspace.
[workspace]

[package]
name = "zeebra"
description = "Computational algebra over finite fields for cryptography: fields, polynomials, NTT, linear algebra, Gröbner bases (F4, FGLM) and polynomial system solving"
repository = "https://github.com/mfaulk/zeebra"
homepage = "https://github.com/mfaulk/zeebra"
documentation = "https://docs.rs/zeebra"
version = "0.1.0"
edition = "2021"
# Measured: 1.90 lacks the stabilized `carrying_add`/`borrowing_sub`. CI's `msrv` job holds it.
rust-version = "1.91"
license = "MIT"
readme = "README.md"
keywords = ["algebra", "grobner", "finite-field", "polynomial", "zero-knowledge"]
categories = ["mathematics", "cryptography", "science"]
# What a consumer does not need: this repository's measurement records and research notes, its
# agent and CI tooling, editor settings, and the check on committed records (whose data is excluded
# with it). `docs/guide/` stays: `src/lib.rs` compiles every guide page as a doctest.
exclude = [
    "/.cargo",
    "/.config",
    "/.github",
    "/.idea",
    "/CLAUDE.md",
    "/clippy.toml",
    "/docs/MILESTONE-*.md",
    "/docs/research",
    "/research",
    "/scripts",
    "/tests/committed_records.rs",
    "/tools",
    "/zeebra.jpg",
]


[lib]
# Doc examples are compiled and run. They were disabled, which made the CI job that runs them
# green and vacuous: the crate had no executable examples at all, only `text` and `ignore` fences.
doctest = true

# The unit suite is not a benchmark. `bench` defaults to true, so `cargo bench -- --test` built
# the lib as a bench target and ran all ~1400 unit tests in *one process* under the built-in
# harness — a second, worse-isolated run of what `cargo nextest` already covers with a process
# per test. It broke `util::peak_memory`, whose subject is `VmHWM`, a process-wide high-water
# mark: in a shared process the other tests leave the mark well above live RSS, so touching
# 32 MB no longer raises it by 32 MB and the assertion fails. See #170.
bench = false

# Same reason, and this target carries no `#[test]`s at all — so under `cargo bench` it was a
# whole-crate link for a harness with nothing to run. Declared explicitly only to set the flag;
# autodiscovery still governs the path, and in edition 2021 naming one bin does not suppress it.
[[bin]]
name = "zeebra-differential"
bench = false

[features]
default = ["external-runners"]

# Driving external Gröbner engines (msolve, Groebner.jl, Sagebrush, Singular) as subprocesses.
#
# **Adds no dependency**, and is on by default for that reason: the interface to every one of
# these tools is text, so `src/grobner/external` is pure `std`. Gating it off by default would
# only hide its tests from CI, which runs `cargo nextest run` with default features.
#
# The gate exists for two things it does buy. A consumer who wants none of this can switch it off
# with `default-features = false`. And an adapter that *does* need a dependency — a Julia bridge
# wanting a JSON parser, say — goes behind a sub-feature of this one, so the core crate never
# acquires it. That is the "no new required dependency" guarantee, made structural rather than
# promised.
external-runners = []

# Opt-in work/GCD-size diagnostics and owned FGLM executor measurements.
# Production defaults stay unchanged; diagnostic scopes must also be explicitly enabled.
research-work = []

# Research-only multirow (band) sparse pivot reuse for #715. Compiled out by default; with the
# feature on, the production single-row path stays selected unless a caller opts in per thread.
research-multirow = []

# Research-only signature-compatible F4 engine for #857 (RFC `docs/research/signature-f4-rfc.md`).
# An isolated module behind its own entry point; the shipping F4 never reads it. Needs the
# dependency-free `external-runners` corpus types for its pinned correctness constructions.
research-sigf4 = ["external-runners"]

# #902's replay of the cross-target cascade (`sigf4::replay`): engine call sites that record each
# batch's dependency trace when a recording is active; and #933's replay of the symbolic closure
# (`sigf4::symbolic_replay`). Separate so the plain research engine compiles none of it.
research-sigf4-replay = ["research-sigf4"]

# #901's instrument: per-batch reducer-block / cross-target-cascade split of the signature engine's
# elimination, and clocks on the engine's unstaged glue. Off in every timed binary.
research-sigf4-split = ["research-sigf4"]

# #936's instrument: which signature-basis elements the rewrite and syzygy criteria and the batch
# matrices consult, the syzygy-store call log and its offline replay. Off in every timed binary.
research-sigf4-usage = ["research-sigf4"]

# #1031's reduced-multiple reuse census (`grobner::reuse_census`): replays every batch with its
# reducer block as built and tail-reduced, on the signature engine (opt-in per run) and, through
# a batch observer, the conventional one. Off in every timed binary.
research-reuse = ["research-sigf4", "research-work"]

# #1075's adjacent-round census (`sigf4::adjacent`): a previous-batch buffer of each row's run-wide
# monomial ids, counted (`Count`) or served in place of the products and interning (`Reuse`). Opt-in
# per run; off in every shipping binary.
research-adjacent = ["research-sigf4"]

# #1168's bounded ZDD normal-form prototype (`boolean`): Boolean polynomials in GF(2)[x]/<x_i^2+x_i>
# under verified triangular rules. Research only; nothing else in the crate reads it.
research-zdd = []

# `Arbitrary` impls for the public types (fields, integers, monomials, polynomials, vectors and
# matrices). Purely additive: `Ring` does not require `Arbitrary`, so a downstream `Ring` impl is
# unaffected by whether some other crate in the build turns this on.
proptest = ["dep:proptest"]

[dependencies]
lazy_static = "1.4.0"
pest = "2.7"
pest_derive = "2.7"
# Optional: the `proptest` feature implements `Arbitrary` for the public types, so a downstream
# crate can property-test against them. Off by default, because proptest brings 17 crates
# (rustix, tempfile, rusty-fork, regex-syntax, ...) that nothing else in the library needs.
proptest = { version = "1.3.1", optional = true }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_arrays = "0.1.0"

# Targets that drive the external-engine harness, which `external-runners` gates. Declared so that

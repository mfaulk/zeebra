# Standalone package: prevents Cargo from searching parent directories for a workspace.
[workspace]

[package]
name = "zeebra"
description = "Computational algebra over finite fields for cryptography: fields, polynomials, NTT, linear algebra, Gröbner bases (F4, FGLM) and polynomial system solving"
repository = "https://github.com/mfaulk/zeebra"
homepage = "https://github.com/mfaulk/zeebra"
documentation = "https://docs.rs/zeebra"
version = "0.1.0"
edition = "2021"
license = "MIT"
readme = "README.md"
keywords = ["algebra", "grobner", "finite-field", "polynomial", "zero-knowledge"]
categories = ["mathematics", "cryptography", "science"]
# What a consumer does not need: this repository's measurement records and research notes, its
# agent and CI tooling, editor settings, and the check on committed records (whose data is excluded
# with it). `docs/guide/` stays: `src/lib.rs` compiles every guide page as a doctest.
exclude = [
    "/.cargo",
    "/.config",
    "/.github",
    "/.idea",
    "/CLAUDE.md",
    "/clippy.toml",
    "/docs/MILESTONE-*.md",
    "/docs/research",
    "/research",
    "/scripts",
    "/tests/committed_records.rs",
    "/tools",
    "/zeebra.jpg",
]


[lib]
# Doc examples are compiled and run. They were disabled, which made the CI job that runs them
# green and vacuous: the crate had no executable examples at all, only `text` and `ignore` fences.
doctest = true

# The unit suite is not a benchmark. `bench` defaults to true, so `cargo bench -- --test` built
# the lib as a bench target and ran all ~1400 unit tests in *one process* under the built-in
# harness — a second, worse-isolated run of what `cargo nextest` already covers with a process
# per test. It broke `util::peak_memory`, whose subject is `VmHWM`, a process-wide high-water
# mark: in a shared process the other tests leave the mark well above live RSS, so touching
# 32 MB no longer raises it by 32 MB and the assertion fails. See #170.
bench = false

# Same reason, and this target carries no `#[test]`s at all — so under `cargo bench` it was a
# whole-crate link for a harness with nothing to run. Declared explicitly only to set the flag;
# autodiscovery still governs the path, and in edition 2021 naming one bin does not suppress it.
[[bin]]
name = "zeebra-differential"
bench = false

[features]
default = ["external-runners"]

# Driving external Gröbner engines (msolve, Groebner.jl, Sagebrush, Singular) as subprocesses.
#
# **Adds no dependency**, and is on by default for that reason: the interface to every one of
# these tools is text, so `src/grobner/external` is pure `std`. Gating it off by default would
# only hide its tests from CI, which runs `cargo nextest run` with default features.
#
# The gate exists for two things it does buy. A consumer who wants none of this can switch it off
# with `default-features = false`. And an adapter that *does* need a dependency — a Julia bridge
# wanting a JSON parser, say — goes behind a sub-feature of this one, so the core crate never
# acquires it. That is the "no new required dependency" guarantee, made structural rather than
# promised.
external-runners = []

[dependencies]
lazy_static = "1.4.0"
pest = "2.7"
pest_derive = "2.7"
# `proptest` is a normal dependency, not a dev-dependency: `Arbitrary` is implemented for public
# types so that downstream crates can property-test against them.
proptest = "1.3.1"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_arrays = "0.1.0"

# Targets that drive the external-engine harness, which `external-runners` gates. Declared so that
# `cargo build --all-targets --no-default-features` skips them rather than failing; CI checks that
# build, because nothing else would notice the library itself stop compiling without the feature.
[[example]]
name = "competitive"
required-features = ["external-runners"]

[[example]]
name = "competitive_sweep"
required-features = ["external-runners"]

[[example]]
name = "f4_profile"
required-features = ["external-runners"]

[[example]]
name = "interreduce_working_set"
required-features = ["external-runners"]

[[example]]
name = "interreduction_repeats"
required-features = ["external-runners"]

[[example]]
name = "interreduction_routes"
required-features = ["external-runners"]

[[test]]
name = "external_comparands"
required-features = ["external-runners"]

[[test]]
name = "committed_records"
required-features = ["external-runners"]

[dev-dependencies]
# `ark-ff` is a *test oracle only*, in the role Singular already plays for Gröbner bases: the
# 256-bit prime field arithmetic in `fields::prime_field_256` is checked against an independent,
# widely deployed implementation. Nothing in the shipped crate depends on it. The two scalar
# fields are declared from their moduli through `MontConfig` rather than taken from `ark-bn254`
# and `ark-bls12-381`, which pull in `ark-ec` and the whole curve stack unconditionally.
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
bincode = "1.3.3"
criterion = { version = "0.5", features = ["html_reports"] }

# `test = false` on every benchmark, for CI wall-clock. A `[[bench]]` target defaults to `test =
# true`, so a bare `cargo test` builds each criterion binary and runs it with `--test`, which
# executes every benchmark once. That smoke test is worth having — it catches a benchmark that
# panics rather than merely failing to compile — but it is not a test of the library, and it
# dominated the suite. Measured warm in release: `cargo test --release` took 180s before this
# change and 11.6s after, against 2.4s for the 968 tests and 8.9s for the 13 doc examples. The
# ~168s was the eight benchmarks, split between linking them under `lto = "fat"` with
# `codegen-units = 1` — eight whole-crate LTO links — and executing 455 cases. It is now a
# separate CI job running `cargo bench --profile ci-release -- --test` on pushes to main, off the
# pull-request path; that job takes no measurements, so it has no use for the fat-LTO links above.
#
# `--all-targets` still builds these, so a benchmark that stops compiling still breaks every job
# that uses it; `test = false` governs only whether `cargo test` runs them.

[[bench]]
name = "field_arithmetic"
harness = false
test = false

[[bench]]
name = "sparse_polynomial"
harness = false
test = false

[[bench]]
name = "linear_algebra"
harness = false
test = false

[[bench]]
name = "sparse_linear_algebra"
harness = false
test = false

[[bench]]
name = "grobner"
harness = false
test = false

[[bench]]
name = "f4_stages"
harness = false
test = false

[[bench]]
name = "f4_matrix_corpus"
harness = false
test = false

[[bench]]
name = "fglm"
harness = false
test = false

[[bench]]
name = "polynomial_solving"
harness = false
test = false

[[bench]]
name = "monomial_order"
harness = false
test = false

[[bench]]
name = "multivariate_gcd"
harness = false
test = false

[[bench]]
name = "pow_strategy"
harness = false
test = false

# Field arithmetic is a handful of small generic functions — `mul`, `add`, `is_zero` — called from
# inner loops in other modules. Without cross-codegen-unit inlining the elimination kernels pay a
# call per field operation, which is the case link-time optimization exists for. `codegen-units =
# 1` for the same reason and to make benchmark numbers reproducible: the default of 16 partitions
# the crate differently as code moves between modules, so an unrelated edit can shift a
# measurement.
#
# `[profile.bench]` is deliberately not restated: `bench` inherits `release`, including these
# overrides. Verified with `cargo build --profile bench -v`, which shows `-C lto` and
# `-C codegen-units=1`.
#
# This costs build time. It is accepted because every number this project reports is taken in
# release, so the release profile is the measurement instrument and should not differ from what
# is shipped.
[profile.release]
lto = "fat"
codegen-units = 1

# The profile CI tests in, and nothing else. The release job exists because `debug-assertions`
# and `overflow-checks` are off in release, so arithmetic wraps instead of panicking and every
# `debug_assert`-guarded invariant goes unchecked; those come from `release` and are inherited
# here, so what that job tests is unchanged. Fat LTO and a single codegen unit are not — they buy
# inlining and reproducible measurements, and the job takes no measurements.
#
# They are most of its wall clock. `Swatinem/rust-cache` caches dependencies and never the crate
# under test, so `zeebra` is relinked from scratch on every run: of the 321s the release test
# step took, ~318s was that link.
#
# The settings below are a measured compromise, not an obvious choice, because the two costs pull
# against each other. Dropping `codegen-units = 1` is what makes the build cheap, and it is also
# what slows the two `#[ignore]`d engine-agreement tests down -- they are the one place where the
# per-field-operation call overhead that LTO exists to remove actually shows up. Cold
# `cargo test --no-run`, then those two tests, measured locally:
#
#     lto = "fat",  codegen-units = 1    392s    41.6s     <- `release`
#     lto = false,  codegen-units = 1    248s    45.6s
#     lto = false,  codegen-units = 16    48.8s  120.0s
#     lto = "thin", codegen-units = 16    48.9s  107.6s    <- here
#
# So the inlining that those tests depend on comes from the single codegen unit and not from LTO:
# this is one crate, and the field arithmetic being inlined is inside it, so there is little for
# a cross-crate link step to do. Thin LTO is kept anyway because it costs nothing against `lto =
# false` at 16 units and still recovers ~12s. The sum is what CI pays per run, and it is lowest
# here -- 157s against 434s for `release`.
#
# Measurements deliberately do not use this. `cargo bench` resolves `[profile.bench]`, which
# inherits `release`, so every number this project reports still comes from a fat-LTO build at one
# codegen unit, and stays comparable with every number recorded before this profile existed. The
# CI smoke job overrides it with `--profile ci-release` precisely because it reports no numbers:
# it runs each case once under `--test` and records nothing.
[profile.ci-release]
inherits = "release"
lto = "thin"
codegen-units = 16

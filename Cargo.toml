# Field arithmetic is a handful of small generic functions — `mul`, `add`, `is_zero` — called from
# inner loops in other modules. Without cross-codegen-unit inlining the elimination kernels pay a
# call per field operation, which is the case link-time optimization exists for. `codegen-units =
# 1` for the same reason and to make benchmark numbers reproducible: the default of 16 partitions
# the crate differently as code moves between modules, so an unrelated edit can shift a
# measurement.
#
# `[profile.bench]` is deliberately not restated: `bench` inherits `release`, including these
# overrides. Verified with `cargo build --profile bench -v`, which shows `-C lto` and
# `-C codegen-units=1`.
#
# This costs build time. It is accepted because every number this project reports is taken in
# release, so the release profile is the measurement instrument and should not differ from what
# is shipped.
[profile.release]
lto = "fat"
codegen-units = 1

# Full debuginfo makes every test and example binary ~1.4 GB, and `cargo test` links 110+ of them,
# so linking dominated the edit loop. Measured 2026-11-16 (mold, no sccache): `cargo test
# --no-run` after a one-line edit took 73-103 s with full debuginfo and 15-16 s with line tables;
# `target/debug` shrank from 65 GB to 24 GB. Backtraces keep file:line. For a debugger session
# that needs locals, set `CARGO_PROFILE_DEV_DEBUG=true`. `test` inherits this; release is unaffected.
[profile.dev]
debug = "line-tables-only"

# Fast PR tests retain release arithmetic semantics but avoid whole-program optimization.
# The workflow restores opt-level 3 and Thin LTO on main, scheduled and manual runs.
# Production `release` and `bench` profiles remain unchanged; CI takes no algebra measurements.
[profile.ci-release]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 16


[dev-dependencies]
# `ark-ff` is a *test oracle only*, in the role Singular already plays for Gröbner bases: the
# 256-bit prime field arithmetic in `fields::prime_field_256` is checked against an independent,
# widely deployed implementation. Nothing in the shipped crate depends on it. The two scalar
# fields are declared from their moduli through `MontConfig` rather than taken from `ark-bn254`
# and `ark-bls12-381`, which pull in `ark-ec` and the whole curve stack unconditionally.
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
bincode = "1.3.3"
# Research-only established-runtime comparand; already present transitively via Criterion.
rayon = "=1.12.0"
criterion = { version = "0.5", features = ["html_reports"] }
# The crate's own property tests; the `Arbitrary` impls they use are compiled under `cfg(test)`.
proptest = "1.3.1"

# Criterion smoke tests run separately on code PRs and full runs. Keep them out of a plain
# `cargo test`, and use `cargo bench --profile ci-release -- --test` to execute setup once
# without taking measurements. Clippy still checks all targets on code PRs.

[[bench]]
name = "field_arithmetic"
harness = false
test = false

[[bench]]
name = "sparse_polynomial"
harness = false
test = false


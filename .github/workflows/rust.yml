name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

# A new run supersedes an older run of the same event, PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Environment flags replace .cargo/config.toml's flags, so repeat the ISA floor.
  RUSTFLAGS: -D warnings -C target-cpu=x86-64-v3

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine required checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-paths"
            bash tools/ci-scope.sh < "$RUNNER_TEMP/ci-paths" >> "$GITHUB_OUTPUT"
          else
            printf 'rust=true\ndocs=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate classification outputs
        env:
          RUST_CHECKS: ${{ steps.scope.outputs.rust }}
          DOC_CHECKS: ${{ steps.scope.outputs.docs }}
        run: |
          case "$RUST_CHECKS/$DOC_CHECKS" in
            true/true|false/true|false/false) ;;
            *) echo "Invalid CI scope outputs" >&2; exit 1 ;;
          esac

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
      # Nextest builds test binaries; Clippy checks examples and benchmarks on PRs.
      # Main, scheduled and manual runs also link every standalone target.
      - name: Build all targets
        if: github.event_name != 'pull_request'
        run: cargo build --all-targets --timings
      - name: Test
        if: needs.changes.outputs.rust == 'true'
        run: cargo nextest run --profile ci
      - name: Check guide inclusion
        if: needs.changes.outputs.rust != 'true'
        run: cargo test --test documentation
      - name: MQ10 profiling instrument tests
        run: |
          cargo test --example mq10_profile
          cargo test --example public_corpus
          cargo test --example elimination_kernel_study
          python3 tools/test/elimination-kernel-study-test.py
          python3 research/elimination-kernels/summarize.py
          git diff --exit-code -- research/elimination-kernels/summary.json research/elimination-kernels/curves.csv
          cargo test --example row_merge_study
          python3 tools/test/row-merge-study-test.py
          python3 tools/test/mq10-profile-test.py
          python3 tools/test/grobx-trajectory-test.py
          python3 tools/test/grobx-work-study-test.py
          python3 tools/test/grobx-randomization-test.py
          python3 tools/external/grobx-driver/research/randomization/test_policy.py
          python3 tools/test/proof-artifacts-test.py
          python3 research/grobx-trajectory/summarize.py
          git diff --exit-code -- research/grobx-trajectory/summary.json research/grobx-trajectory/summary.csv research/grobx-trajectory/summary-rounds.csv
          cargo test --features research-work --lib linalg::work
          cargo test --features research-work --example mq10_profile
          python3 tools/test/public-corpus-test.py
      - name: Isolated delayed-reduction pilot checks
        run: |
          git apply research/elimination-kernels/delayed.patch
          trap 'git apply -R research/elimination-kernels/delayed.patch' EXIT
          cargo test --example elimination_kernel_study
          cargo test --lib h13_pilot_selection_is_explicit
      - name: Doc tests
        run: cargo test --doc -- --test-threads=4
      - name: Upload build timings
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-timings
          path: target/cargo-timings/
          if-no-files-found: ignore

  release-tests:
    name: Tests (release)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Keep the previous optimizer coverage on full runs outside PRs.
    env:
      CARGO_PROFILE_CI_RELEASE_LTO: ${{ github.event_name == 'pull_request' && 'off' || 'thin' }}
      CARGO_PROFILE_CI_RELEASE_OPT_LEVEL: ${{ github.event_name == 'pull_request' && '2' || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # Separate build/execution so the logs distinguish compiler time from test time.
      - name: Build release tests
        run: cargo test --profile ci-release --no-run --timings
      - name: Test (release)
        run: cargo nextest run --profile ci --cargo-profile ci-release
      # This workload regressed when reduced batch rows raised the live-entry demand.
      # Run it on PRs too; the debug build keeps it ignored for cost.
      - name: Reduced batch live-budget regression
        run: |
          cargo nextest run --profile ci --cargo-profile ci-release --lib --run-ignored=only \
            -E 'test(=grobner::f4::tests::test_reduced_batches_complete_the_measured_live_budget_regression)'
      - name: Doc tests (release)
        if: github.event_name != 'pull_request'
        run: cargo test --profile ci-release --doc -- --test-threads=4
      - name: Gröbner engines agree on the slow systems
        if: github.event_name != 'pull_request'
        run: |
          cargo nextest run --profile ci --cargo-profile ci-release --lib --run-ignored=only \
            -E 'test(=grobner::buchberger::tests::test_optimized_agrees_with_reference_on_slow_systems) + test(=grobner::f4::tests::test_f4_on_larger_systems)'
      # The opt-in large corpus is excluded; its capture gate is run explicitly off CI.
      - name: The F4 matrix corpus is as pinned
        if: github.event_name != 'pull_request'
        run: |
          cargo nextest run --profile ci --cargo-profile ci-release --lib --run-ignored=only \
            -E 'test(=grobner::f4::matrix_corpus::tests::test_every_entry_is_pinned_and_in_its_regime)'
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-timings
          path: target/cargo-timings/
          if-no-files-found: ignore

  bench-smoke:
    name: Benchmarks run
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Keep the previous optimizer coverage on full runs outside PRs.
    env:
      CARGO_PROFILE_CI_RELEASE_LTO: ${{ github.event_name == 'pull_request' && 'off' || 'thin' }}
      CARGO_PROFILE_CI_RELEASE_OPT_LEVEL: ${{ github.event_name == 'pull_request' && '2' || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compilation alone misses setup panics (#586). Keep execution on code PRs.
      # This smoke test samples nothing and publishes no performance figures.
      - name: Benchmarks execute without panicking
        run: cargo bench --profile ci-release -- --test

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # `!cancelled()` rather than the default: formatting and linting are independent, and a
      # misplaced brace should not hide every clippy finding behind a second round trip.
      - name: Lint
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The crate as a consumer gets it with `default-features = false`. Every other job builds
      # the default, which is how `f4::matrix_corpus` came to import from the feature-gated
      # `external::corpus` and leave the library uncompilable without the feature, unnoticed.
      # Targets that drive the harness declare `required-features` and are skipped here.
      - name: Lint without default features
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      # proptest and its 17 transitive crates belong behind the `proptest` feature (#676). A
      # stray un-gated `use proptest` would fail the lint above. A dependency entry that loses its
      # `optional = true` would not, so this step checks the graph a default consumer gets.
      - name: proptest stays out of the default dependency graph
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: |
          if cargo tree --locked -e normal --prefix none | grep -q '^proptest '; then
            echo "proptest is a normal dependency of a default build; gate it behind the feature" >&2
            exit 1
          fi

      # docs.rs renders these pages for every published version, so a broken intra-doc link is a
      # dead link in the published docs. All features, matching `package.metadata.docs.rs`.
      - name: Rustdoc
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

      - name: Package
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: cargo package --locked

  # `rust-version` in Cargo.toml is a promise to consumers; this is what keeps it true. Library
  # only: dev-dependencies and benches may use a newer toolchain without breaking a consumer.
  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: Swatinem/rust-cache@v2

      - name: Check the library on the declared MSRV
        run: cargo check --lib --all-features --locked

  agent-scripts:
    name: Agent coordination scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck -S warning \
            scripts/agent/*.sh scripts/agent/test/*.sh \
            tools/*.sh tools/test/*.sh tools/external/*.sh tools/external/smoke/*.sh

      # `!cancelled()` for the same reason as the lint job: a shellcheck finding should not hide
      # a behavioural failure behind a second round trip.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          bash scripts/agent/test/zb-claim-test.sh
          bash tools/test/rss-guard-test.sh
          bash tools/test/merge-base-age-test.sh
          bash tools/test/benchlock-test.sh
          bash tools/test/check-measurement-provenance-test.sh
          bash tools/test/ci-scope-test.sh

      # Every document that publishes a measurement says which commit it came from (#335). Separate
      # from the unit tests above because this one reads the repository's own documents: a finding
      # here is a document to fix, not a script that is broken.
      - name: Measurement provenance
        if: ${{ !cancelled() }}
        run: bash tools/check-measurement-provenance.sh

  merge-staleness:
    name: Merge base staleness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`: the script diffs the tested base against the current tip of the base
      # branch, and the default single-commit fetch has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the tested merge base against the base branch
        env:
          TESTED_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          git fetch --quiet origin "$BASE_REF"
          rc=0
          report="$(bash tools/merge-base-age.sh "$TESTED_BASE" "$HEAD_SHA" "origin/$BASE_REF" 2>&1)" || rc=$?
          printf '%s\n' "$report" >>"$GITHUB_STEP_SUMMARY"
          case $rc in
            0|1) printf '%s\n' "$report" ;;
            3)
              printf '%s\n' "$report"
              echo "::warning title=Tested merge base is stale and overlapping::This run's merge was computed against an older $BASE_REF, and the commits since then touch files this pull request changes. Rebase and let CI re-run before merging (#339)."
              ;;
            *)
              printf '%s\n' "$report" >&2
              echo "::error title=Staleness check failed::The staleness check could not read the repository. This is not evidence that the merge base is current."
              exit 1
              ;;
          esac

  complete:
    name: CI complete
    needs: [changes, test, release-tests, bench-smoke, lint, msrv, agent-scripts, merge-staleness]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful or intentionally skipped checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCOPE_RESULT: ${{ needs.changes.result }}
        run: |
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "CI dependency ended with $result" >&2; exit 1 ;;
            esac
          done

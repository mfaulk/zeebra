name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

# A new run supersedes an older run of the same event, PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Environment flags replace .cargo/config.toml's flags, so repeat the ISA floor.
  RUSTFLAGS: -D warnings -C target-cpu=x86-64-v3

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      docs: ${{ steps.scope.outputs.docs }}
      comparand: ${{ steps.scope.outputs.comparand }}
      # The slow checks run nightly and on manual dispatch only, never on PRs or pushes (#924).
      nightly: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine required checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-paths"
            bash tools/ci-scope.sh < "$RUNNER_TEMP/ci-paths" >> "$GITHUB_OUTPUT"
          else
            printf 'rust=true\ndocs=true\ncomparand=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate classification outputs
        env:
          RUST_CHECKS: ${{ steps.scope.outputs.rust }}
          DOC_CHECKS: ${{ steps.scope.outputs.docs }}
          COMPARAND_CHECKS: ${{ steps.scope.outputs.comparand }}
        run: |
          case "$RUST_CHECKS/$DOC_CHECKS/$COMPARAND_CHECKS" in
            true/true/true|true/true/false|false/true/false|false/false/false) ;;
            *) echo "Invalid CI scope outputs" >&2; exit 1 ;;
          esac

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--tests` builds only targets that run tests; Clippy checks that the rest compile, and the
      # nightly run links every standalone target.
      - name: Build all targets
        if: needs.changes.outputs.nightly == 'true'
        run: cargo build --all-targets --timings
      - name: Test
        if: needs.changes.outputs.rust == 'true'
        run: cargo nextest run --profile ci --tests
      - name: Check guide inclusion
        if: needs.changes.outputs.rust != 'true'
        run: cargo test --test documentation
      - name: Doc tests
        run: cargo test --doc -- --test-threads=4
      - name: Upload build timings
        if: always() && needs.changes.outputs.nightly == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-timings
          path: target/cargo-timings/
          if-no-files-found: ignore

  # Nightly (#924). One runner per set because each feature set recompiles the whole crate; run
  # serially they were 15-38 minutes (#922). Sets share one rust-cache key: their dependencies match.
  research:
    name: Research artifacts (${{ matrix.set }})
    needs: changes
    if: needs.changes.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        set: [default, delayed-reduction, comparand-replay, research-work, research-multirow, research-sigf4, research-sigf4-replay, research-sigf4-split, research-sigf4-usage, research-reuse, research-adjacent]
    env:
      # The replay builds nothing and runs only when its inputs change (tools/ci-scope.sh).
      ACTIVE: ${{ matrix.set != 'comparand-replay' || needs.changes.outputs.comparand == 'true' }}
      RUST: ${{ matrix.set != 'comparand-replay' }}
    steps:
      - uses: actions/checkout@v4
        if: env.ACTIVE == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.ACTIVE == 'true' && env.RUST == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.ACTIVE == 'true' && env.RUST == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Research checks
        if: env.ACTIVE == 'true'
        run: bash tools/ci-research.sh ${{ matrix.set }}

  release-tests:
    name: Tests (release)
    needs: changes
    if: needs.changes.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    # Nightly, so it can afford the optimizer coverage `ci-release` drops: opt-level 3 and thin LTO.
    env:
      CARGO_PROFILE_CI_RELEASE_LTO: thin
      CARGO_PROFILE_CI_RELEASE_OPT_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Separate build/execution so the logs distinguish compiler time from test time.
      # `--tests` skips the `test = false` examples: they run nothing here, the debug job and Clippy
      # check they compile, and building them optimized was 60% of this job's compile time (#921).
      - name: Build release tests
        run: cargo test --profile ci-release --tests --no-run --timings
      - name: Test (release)
        run: cargo nextest run --profile ci --cargo-profile ci-release --tests
      # This workload regressed when reduced batch rows raised the live-entry demand; the debug
      # build keeps it ignored for cost.
      - name: Reduced batch live-budget regression
        run: |
          cargo nextest run --profile ci --cargo-profile ci-release --lib --run-ignored=only \
            -E 'test(=grobner::f4::tests::test_reduced_batches_complete_the_measured_live_budget_regression)'
      - name: Doc tests (release)
        run: cargo test --profile ci-release --doc -- --test-threads=4
      - name: Gröbner engines agree on the slow systems
        run: |
          cargo nextest run --profile ci --cargo-profile ci-release --lib --run-ignored=only \
            -E 'test(=grobner::buchberger::tests::test_optimized_agrees_with_reference_on_slow_systems) + test(=grobner::f4::tests::test_f4_on_larger_systems)'
      # The opt-in large corpus is excluded; its capture gate is run explicitly off CI.
      - name: The F4 matrix corpus is as pinned
        run: |
          cargo nextest run --profile ci --cargo-profile ci-release --lib --run-ignored=only \
            -E 'test(=grobner::f4::matrix_corpus::tests::test_every_entry_is_pinned_and_in_its_regime)'
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-timings
          path: target/cargo-timings/
          if-no-files-found: ignore

  bench-smoke:
    name: Benchmarks run
    needs: changes
    if: needs.changes.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    # Nightly, so it can afford the optimizer coverage `ci-release` drops: opt-level 3 and thin LTO.
    env:
      CARGO_PROFILE_CI_RELEASE_LTO: thin
      CARGO_PROFILE_CI_RELEASE_OPT_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compilation alone misses setup panics (#586), so the nightly run executes each case once.
      # This smoke test samples nothing and publishes no performance figures.
      - name: Benchmarks execute without panicking
        run: cargo bench --profile ci-release -- --test
      # submit -> run -> report -> verify on a real child (#969); timing is ignored.
      - name: bench-job smoke
        if: ${{ !cancelled() }}
        run: |
          cargo build --profile ci-release --features research-sigf4 --example sig_f4_study
          tools/bench-job-smoke.sh target/ci-release/examples/sig_f4_study "$GITHUB_SHA" /tmp/bench-job-smoke  # $RUNNER_TEMP is under $HOME, which bench-job refuses

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: scripts/ci-lint.sh fmt

      # `!cancelled()` rather than the default: formatting and linting are independent, and a
      # misplaced brace should not hide every clippy finding behind a second round trip.
      - name: Lint
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: scripts/ci-lint.sh clippy

      # The crate as a consumer gets it with `default-features = false`. Every other job builds
      # the default, which is how `f4::matrix_corpus` came to import from the feature-gated
      # `external::corpus` and leave the library uncompilable without the feature, unnoticed.
      # Targets that drive the harness declare `required-features` and are skipped here.
      - name: Lint without default features
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: scripts/ci-lint.sh clippy-no-default

      # proptest and its 17 transitive crates belong behind the `proptest` feature (#676). A
      # stray un-gated `use proptest` would fail the lint above. A dependency entry that loses its
      # `optional = true` would not, so this step checks the graph a default consumer gets.
      - name: proptest stays out of the default dependency graph
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: scripts/ci-lint.sh proptest-graph

      # docs.rs renders these pages for every published version, so a broken intra-doc link is a
      # dead link in the published docs. All features, matching `package.metadata.docs.rs`.
      - name: Rustdoc
        if: ${{ !cancelled() }}
        run: scripts/ci-lint.sh rustdoc

      - name: Package
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: scripts/ci-lint.sh package

  # `rust-version` in Cargo.toml is a promise to consumers; this is what keeps it true. Library
  # only: dev-dependencies and benches may use a newer toolchain without breaking a consumer.
  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check the library on the declared MSRV
        run: cargo check --lib --all-features --locked

  agent-scripts:
    name: Agent coordination scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck -S warning \
            scripts/agent/*.sh scripts/agent/test/*.sh \
            scripts/fetch-eprint scripts/test/*.sh scripts/ci-lint.sh .githooks/pre-push \
            tools/*.sh tools/test/*.sh tools/external/*.sh tools/external/smoke/*.sh

      # `!cancelled()` for the same reason as the lint job: a shellcheck finding should not hide
      # a behavioural failure behind a second round trip.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          bash scripts/agent/test/zb-claim-test.sh
          bash scripts/test/fetch-eprint-test.sh
          bash scripts/test/pre-push-test.sh
          bash tools/test/rss-guard-test.sh
          bash tools/test/merge-base-age-test.sh
          bash tools/test/benchlock-test.sh
          bash tools/test/check-measurement-provenance-test.sh
          bash tools/test/ci-scope-test.sh
          bash tools/test/ci-research-test.sh
          bash tools/test/cpu-context-test.sh
          bash tools/test/bench-reserve-test.sh
          bash tools/test/bench-isolation-audit-test.sh
          bash tools/test/bench-clock-test.sh
          python3 tools/test/bench-contamination-test.py
          bash tools/test/bench-job-test.sh
          python3 tools/test/bench-stats-test.py
          python3 tools/test/corpus-lineage-test.py
          python3 tools/test/m34-public-corpus-test.py
          python3 tools/test/m34-structural-corpus-test.py
          bash tools/test/check-archive-reproducible-test.sh
          bash tools/test/check-agent-authorship-test.sh

      - name: M29 baseline campaign helpers
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s research/m29-baseline -p 'test_*.py'

      - name: M33 admission draw and basis digest
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s research/m33-baseline -p 'test_*.py'

      - name: M33-I publication campaign helpers and tables
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/m33-final -p 'test_*.py'
          python3 research/m33-final/summarize.py --check

      - name: M33 Q qualification manifests and verdicts
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s research/m33-qualification -p 'test_*.py'

      - name: M34 G2 qualification plan and verdicts
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s research/m34-qualification -p 'test_*.py'

      - name: "#1009 feature extraction cost tables"
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/1009-feature-costs -p 'test_*.py'
          python3 research/1009-feature-costs/summarize.py --check

      - name: M33 G1 attribution helpers and tables
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/m33-grobx-attribution -p 'test_*.py'
          python3 research/m33-grobx-attribution/summarize.py --check

      - name: M33 M1 attribution helpers and tables
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/m33-msolve-attribution -p 'test_*.py'
          python3 research/m33-msolve-attribution/summarize.py --check

      - name: M33 M2 small-prime experiment helpers and tables
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/m33-small-prime-experiments -p 'test_*.py'
          python3 research/m33-small-prime-experiments/summarize.py --check

      - name: M33 G2 experiment helpers and tables
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/m33-wide-experiments -p 'test_*.py'
          python3 research/m33-wide-experiments/summarize.py --check

      - name: M30 symbolic cost-model campaign helpers
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s research/m30-symbolic -p 'test_*.py'

      - name: Giac comparand artifacts
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/giac -p 'test_*.py'
          python3 research/giac/summary.py > "$RUNNER_TEMP/giac-table.md"
          diff -u research/giac/table.md "$RUNNER_TEMP/giac-table.md"

      - name: NTT caller gate artifacts
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/ntt-caller-gate -p 'test_*.py'
          python3 research/ntt-caller-gate/summary.py > "$RUNNER_TEMP/ntt-caller-table.md"
          diff -u research/ntt-caller-gate/table.md "$RUNNER_TEMP/ntt-caller-table.md"

      - name: Transform-tree estimate artifacts
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s research/transform-tree-gate -p 'test_*.py'
          python3 research/transform-tree-gate/estimate.py > "$RUNNER_TEMP/transform-tree-table.md"
          diff -u research/transform-tree-gate/table.md "$RUNNER_TEMP/transform-tree-table.md"

      # Every document that publishes a measurement says which commit it came from (#335). Separate
      # from the unit tests above because this one reads the repository's own documents: a finding
      # here is a document to fix, not a script that is broken.
      - name: Measurement provenance
        if: ${{ !cancelled() }}
        run: bash tools/check-measurement-provenance.sh

  merge-staleness:
    name: Merge base staleness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`: the script diffs the tested base against the current tip of the base
      # branch, and the default single-commit fetch has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the tested merge base against the base branch
        env:
          TESTED_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          git fetch --quiet origin "$BASE_REF"
          rc=0
          report="$(bash tools/merge-base-age.sh "$TESTED_BASE" "$HEAD_SHA" "origin/$BASE_REF" 2>&1)" || rc=$?
          printf '%s\n' "$report" >>"$GITHUB_STEP_SUMMARY"
          case $rc in
            0|1) printf '%s\n' "$report" ;;
            3)
              printf '%s\n' "$report"
              echo "::warning title=Tested merge base is stale and overlapping::This run's merge was computed against an older $BASE_REF, and the commits since then touch files this pull request changes. Rebase and let CI re-run before merging (#339)."
              ;;
            *)
              printf '%s\n' "$report" >&2
              echo "::error title=Staleness check failed::The staleness check could not read the repository. This is not evidence that the merge base is current."
              exit 1
              ;;
          esac

  # A scheduled failure would otherwise reach only the owner's email; an open issue reaches `orient`.
  nightly-report:
    name: Report nightly failure
    needs: [changes, test, research, release-tests, bench-smoke, lint, msrv, agent-scripts]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Nightly CI failed'
          body="Nightly CI failed on \`${GITHUB_SHA::8}\`: $RUN_URL"
          number="$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  complete:
    name: CI complete
    needs: [changes, test, research, release-tests, bench-smoke, lint, msrv, agent-scripts, merge-staleness]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful or intentionally skipped checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCOPE_RESULT: ${{ needs.changes.result }}
        run: |
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "CI dependency ended with $result" >&2; exit 1 ;;
            esac
          done

name: CI

on:
  push:
    branches: [ "main" ]
  # Every pull request, not only those targeting main: a stack of dependent pull requests has
  # each one based on the previous, and a base-branch filter would leave all but the first
  # unchecked.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `-C target-cpu` is repeated here on purpose. `.cargo/config.toml` sets it for local builds,
  # but the RUSTFLAGS environment variable REPLACES `target.*.rustflags` rather than adding to
  # it — cargo takes the first source it finds and does not merge them. Setting only `-D
  # warnings` here would therefore drop the ISA floor silently, and CI would build at the
  # baseline x86-64 level while every local build used v3. The two must be kept in step.
  RUSTFLAGS: -D warnings -C target-cpu=x86-64-v3

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --verbose

      # These were disabled by `[lib] doctest = false`, which made this job green and vacuous:
      # the crate had no executable doc examples at all. It now runs six — the README's five
      # public-API examples, via the `cfg(doctest)` item in `lib.rs`, plus `F4Options`.
      - name: Doc tests
        run: cargo test --doc --verbose

  release-tests:
    name: Tests (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The whole suite in release, not only the slow tests. `debug-assertions` and
      # `overflow-checks` are off there, so a release build takes different paths through
      # arithmetic and through every `debug_assert`-guarded invariant: monomial multiplication
      # used to wrap rather than panic on exponent overflow, which the debug job could not see.
      # Release is also the configuration every benchmark and measurement uses.
      - name: Test (release)
        run: cargo test --release --verbose

      # The `#[ignore]`d tests that are real but slow, named individually: a bare `--ignored`
      # would also pick up the four `unimplemented!()` placeholders, which panic by design.
      # Release mode is required — the naive reference engine is impractical in a debug build.
      - name: Gröbner engines agree on the slow systems
        run: |
          cargo test --release --lib -- --ignored --exact \
            grobner::buchberger::tests::test_optimized_agrees_with_reference_on_slow_systems \
            grobner::f4::tests::test_f4_on_larger_systems

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

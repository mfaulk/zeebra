name: Pinned grobx driver
on:
  pull_request:
    paths: ['tools/external/grobx-driver/**', 'tools/external/provision-grobx.sh', 'tools/external/grobx-cohort.py', 'tools/external/proof_artifacts.py', 'tools/test/proof-artifacts-test.py', '.github/workflows/grobx-driver.yml']
  push:
    branches: [main]
    paths: ['tools/external/grobx-driver/**', 'tools/external/provision-grobx.sh', 'tools/external/grobx-cohort.py', 'tools/external/proof_artifacts.py', 'tools/test/proof-artifacts-test.py', '.github/workflows/grobx-driver.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/external/grobx-driver
      - run: python3 tools/test/proof-artifacts-test.py
      - run: python3 tools/external/grobx-driver/research/test_instrument.py
      - run: python3 -m py_compile tools/external/grobx-cohort.py
      - run: bash -n tools/external/provision-grobx.sh
      - run: cargo test --locked --manifest-path tools/external/grobx-driver/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/external/grobx-driver/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path tools/external/grobx-driver/Cargo.toml -- --check

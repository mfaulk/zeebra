name: Pinned groebner driver
on:
  pull_request:
    paths: ['tools/external/groebner-driver/**', 'tools/external/provision-groebner-rs.sh', 'tools/external/groebner-cohort.py', '.github/workflows/groebner-driver.yml']
  push:
    branches: [main]
    paths: ['tools/external/groebner-driver/**', 'tools/external/provision-groebner-rs.sh', 'tools/external/groebner-cohort.py', '.github/workflows/groebner-driver.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/external/groebner-driver
      - run: python3 -m py_compile tools/external/groebner-cohort.py
      - run: bash -n tools/external/provision-groebner-rs.sh
      - run: cargo test --locked --manifest-path tools/external/groebner-driver/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/external/groebner-driver/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path tools/external/groebner-driver/Cargo.toml -- --check
